    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050508; 
            font-family: 'Poppins', sans-serif;
        }

        /* --- LAYAR PEMBUKA & INPUT NAMA --- */
        #start-screen {

            top: 0;
            left: 0;
            width: 100%;

            font-weight: 700;

        #start-screen p {

        /* --- TOMBOL SCREENSHOT --- */
        #capture-btn {

        /* --- CONTAINER WEBCAM KANAN BAWAH --- */

        }
        #guide-panel {
            position: absolute; bottom: 50px; left: 0; background: rgba(10, 10, 15, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; padding: 20px; width: 240px; color: #fff; opacity: 0; transform: translateY(10px); pointer-events: none; transition: all 0.3s ease;
        }
        #guide-panel.active { opacity: 1; transform: translateY(0); pointer-events: auto; }
        .guide-item { display: flex; align-items: flex-start; margin-bottom: 15px; gap: 12px; }

        .guide-desc { font-size: 11px; font-weight: 300; opacity: 0.7; margin-top: 2px; display: block;}

        /* --- OVERLAYS & ANIMASI HEARTBEAT --- */
        #spidey-overlay {
            display: none; position: absolute; transform: translate(-50%, -50%); z-index: 5; pointer-events: none; border-radius: 15px; opacity: 0.85; width: 300px; box-shadow: 0 0 30px rgba(255, 0, 51, 0.6);
        }

        #love-overlay {
            display: none; position: absolute; transform: translate(-50%, -50%); z-index: 5; pointer-events: none; width: 180px; height: 180px; object-fit: cover; opacity: 0.95;
            -webkit-mask-image: url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Cpath d='M462.3 62.6C407.5 15.9 326 24.3 275.7 76.2L256 96.5l-19.7-20.3C186.1 24.3 104.5 15.9 49.7 62.6c-62.8 53.6-66.1 149.8-9.9 207.9l193.5 199.8c12.5 12.9 32.8 12.9 45.3 0l193.5-199.8c56.3-58.1 53-154.3-9.8-207.9z'/%3E%3C/svg%3E");
            -webkit-mask-size: contain; -webkit-mask-repeat: no-repeat; -webkit-mask-position: center;
            mask-image: url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Cpath d='M462.3 62.6C407.5 15.9 326 24.3 275.7 76.2L256 96.5l-19.7-20.3C186.1 24.3 104.5 15.9 49.7 62.6c-62.8 53.6-66.1 149.8-9.9 207.9l193.5 199.8c12.5 12.9 32.8 12.9 45.3 0l193.5-199.8c56.3-58.1 53-154.3-9.8-207.9z'/%3E%3C/svg%3E");
            mask-size: contain; mask-repeat: no-repeat; mask-position: center; filter: drop-shadow(0 0 15px #ff0066);
        }

        /* ANIMASI DETAK JANTUNG UNTUK FOTO */
        .heartbeat-anim {
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(1); filter: drop-shadow(0 0 15px #ff0066); }
            50% { transform: translate(-50%, -50%) scale(1.15); filter: drop-shadow(0 0 30px #ff0066); }
            100% { transform: translate(-50%, -50%) scale(1); filter: drop-shadow(0 0 15px #ff0066); }
        }

        #iloveyou-overlay {
            display: none; position: absolute; transform: translate(-50%, 50%); z-index: 5; color: #ffb3ff; font-family: 'Poppins', sans-serif; font-size: 28px; font-weight: 700; letter-spacing: 2px; text-shadow: 0 0 15px #ff66ff, 0 0 30px #ff00ff, 0 0 5px #fff; pointer-events: none; text-align: center; white-space: nowrap;
        }
    </style>
</head>
<body>

    <!-- Audio Files -->
    <audio id="bg-music" src="lagu.mp3" loop></audio>
    <audio id="thwip-sfx" src="thwip.mp3"></audio>
    <audio id="space-sfx" src="space.mp3" loop></audio>

    <!-- Layar Pembuka -->
    <div id="start-screen">
        <h1>Hand Gesture AI</h1>
        <p>Ketik nama doi untuk mengaktifkan personalisasi.</p>
        <input type="text" id="name-input" placeholder="Masukkan nama...">
        <button id="start-btn">Mulai Sekarang</button>
    </div>

    <!-- UI Overlays -->
    <div id="info">
        <span style="font-size: 11px; opacity: 0.8; text-transform: uppercase;">Deteksi Gestur</span><br>
        <span id="mode-label" class="mode-text">KOSMOS</span>
        <small id="status-text">Memuat kamera...</small>
    </div>

    <button id="capture-btn" onclick="takeScreenshot()">📸 Capture</button>

    <div id="guide-wrapper">
        <div id="guide-panel">
            <div class="guide-item"><div class="guide-emoji">✋</div><div><span class="guide-title" style="color: #00d2ff;">Terbuka</span><span class="guide-desc">Mode Kosmos (Suara Space)</span></div></div>
            <div class="guide-item"><div class="guide-emoji">☝️</div><div><span class="guide-title" style="color: #ffaa00;">Telunjuk</span><span class="guide-desc">Mode Orbit Saturnus</span></div></div>
            <div class="guide-item"><div class="guide-emoji">✊</div><div><span class="guide-title" style="color: #ff0066;">Mengepal</span><span class="guide-desc">Bentuk Hati, Detak & Lagu</span></div></div>
            <div class="guide-item"><div class="guide-emoji">🤟</div><div><span class="guide-title" style="color: #ff0033;">Spider-Man</span><span class="guide-desc">Jaring & Efek Suara</span></div></div>
            <div class="guide-item"><div class="guide-emoji">✌️</div><div><span class="guide-title" style="color: #ff66ff;">Peace</span><span class="guide-desc">Teks Nama Spesial & Lagu</span></div></div>
        </div>
        <button id="guide-btn"><span>ℹ️</span> Panduan</button>
    </div>
    
    <!-- HTML Overlays -->
    <img id="spidey-overlay" src="https://media.giphy.com/media/SF9Z0shNT07T2/giphy.gif" alt="Spider-Man Web">
    <img id="love-overlay" src="sekolah.jpg" alt="Love Photo">
    <div id="iloveyou-overlay">I LOVE YOU<br><span id="dynamic-name">SAYANG</span> 🫶</div>

    <!-- Kamera & Canvas Tracking -->
    <div id="webcam-container">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="output_canvas" width="480" height="360"></canvas>
    </div>

    <script>
        const NUM_PARTICLES = 1500;
        let scene, camera, renderer, particleSystem, geometry;
        let currentPos, targetPos;
        let posSpace, posPlanet, posHeart, posWeb, posText; 
        let currentMode = 1;
        let lastMode = 1;
        
        let targetHandX = 0, targetHandY = 0;
        let handX = 0, handY = 0;
        let rotationAngle = 0;
        let customName = "SAYANG";

        const HAND_CONNECTIONS = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];

                // --- FITUR BARU: Fungsi untuk bikin tekstur partikel glowing bulat ---
        function createGlowingTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            
            // Bikin efek cahaya memudar (Radial Gradient)
            const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');     // Titik tengah super terang
            gradient.addColorStop(0.2, 'rgba(255, 255, 255, 0.8)'); // Mulai memudar
            gradient.addColorStop(0.5, 'rgba(255, 255, 255, 0.2)'); // Semakin transparan
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');           // Ujungnya hilang (menyatu dengan background)
            
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 64, 64);
            return new THREE.CanvasTexture(canvas);
        }

                function initThree() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 12;

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(renderer.domElement);

            generateBaseShapes();
            updateTextShape(customName);

            currentPos = new Float32Array(posSpace);
            targetPos = posSpace;

            geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(currentPos, 3));

            // --- FITUR BARU: ShaderMaterial untuk partikel level "mantap" ---
            
            // 1. Uniforms: Data yang dikirim dari JS ke Shader (per piksel/per vertikal)
            const uniforms = {
                uTime: { value: 0 },
                uColor: { value: new THREE.Color(0x00d2ff) }, // Warna dasar
                uColorHighlight: { value: new THREE.Color(0xffffff) } // Warna kerlip terang
            };

            // 2. Vertex Shader: Mengontrol posisi dan ukuran vertikal di GPU
            const vertexShader = `
                uniform float uTime;
                varying vec3 vPosition;
                varying float vDistance;

                void main() {
                    vPosition = position;
                    
                    // Efekdenyut ukuran dinamis berdasarkan waktu dan posisi
                    float pulse = 0.8 + 0.2 * sin(uTime * 3.0 + position.x * 2.0);
                    
                    // Jarak vertikal dari kamera untuk efek blur/halus di GPU
                    vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                    vDistance = -mvPosition.z;
                    
                    // Ukuran diperbesar dan dikalikan efek denies
                    gl_PointSize = (12.0 * pulse) * (50.0 / -mvPosition.z);
                    gl_Position = projectionMatrix * mvPosition;
                }
            `;

            // 3. Fragment Shader: Mengontrol warna dan transparansi per piksel di GPU
            const fragmentShader = `
                uniform float uTime;
                uniform vec3 uColor;
                uniform vec3 uColorHighlight;
                varying vec3 vPosition;
                varying float vDistance;

                void main() {
                    // Buat tekstur glowing bulat sempurna di GPU
                    vec2 coord = gl_PointCoord - vec2(0.5);
                    float d = length(coord);
                    
                    // Efek halus (blur) di pinggir partikel berdasarkan jarak
                    float blur = smoothstep(0.5, 0.5 - (0.1 / vDistance), d);
                    
                    // Efekkerlip warna (twinkle) dinamis berdasarkan waktu dan posisi
                    float twinkle = 0.7 + 0.3 * sin(uTime * 10.0 + vPosition.y * 5.0);
                    
                    // Blend warna dasar dengan warna kerlip terang
                    vec3 finalColor = mix(uColor, uColorHighlight, (1.0 - twinkle) * 0.5);
                    
                    // Aplikasikan warna, kerlip, dan transparansi (alpha)
                    gl_FragColor = vec4(finalColor, (1.0 - smoothstep(0.0, 0.5, d)) * twine);
                    
                    // Aplikasikan efek halus/blur di GPU
                    gl_FragColor.a *= blur;
                    
                    // Hapus piksel di luar area glowing
                    if (gl_FragColor.a < 0.05) discard;
                }
            `;

            // 4. Bikin material menggunakan ShaderMaterial
            const material = new THREE.ShaderMaterial({
                uniforms: uniforms,
                vertexShader: vertexShader,
                fragmentShader: fragmentShader,
                transparent: true,
                depthWrite: false, // Penting agar tidak ada tepi kotak hitam yang saling menutupi
                blending: THREE.AdditiveBlending
            });
            
            particleSystem = new THREE.Points(geometry, material);
            scene.add(particleSystem);

            window.addEventListener('resize', onWindowResize);
            animate();
        }



        function generateBaseShapes() {
            posSpace = new Float32Array(NUM_PARTICLES * 3);
            posPlanet = new Float32Array(NUM_PARTICLES * 3);
            posHeart = new Float32Array(NUM_PARTICLES * 3);
            posWeb = new Float32Array(NUM_PARTICLES * 3);
            posText = new Float32Array(NUM_PARTICLES * 3);

            for (let i = 0; i < NUM_PARTICLES * 3; i += 3) {
                posSpace[i] = (Math.random() - 0.5) * 10; posSpace[i+1] = (Math.random() - 0.5) * 10; posSpace[i+2] = (Math.random() - 0.5) * 10;
            }

            const numSphere = 600;
            for (let i = 0; i < NUM_PARTICLES; i++) {
                const idx = i * 3;
                if (i < numSphere) {
                    const u = Math.random(), v = Math.random();
                    const theta = u * 2.0 * Math.PI, phi = Math.acos(2.0 * v - 1.0), r = 1.3;
                    posPlanet[idx] = r * Math.sin(phi) * Math.cos(theta); posPlanet[idx+1] = r * Math.sin(phi) * Math.sin(theta); posPlanet[idx+2] = r * Math.cos(phi);
                } else {
                    const theta = Math.random() * Math.PI * 2, r = 2.0 + Math.random() * 2.0;
                    posPlanet[idx] = r * Math.cos(theta); posPlanet[idx+1] = (Math.random() - 0.5) * 0.2; posPlanet[idx+2] = r * Math.sin(theta);
                }
            }

            for (let i = 0; i < NUM_PARTICLES; i++) {
                const idx = i * 3, t = (Math.random() * 2 - 1) * Math.PI, p = (Math.random() * 2 - 1) * Math.PI;
                const x = 2.0 * Math.pow(Math.sin(t), 3), y = 2.0 * Math.cos(t) - 0.7 * Math.cos(2*t) - 0.3 * Math.cos(3*t) - 0.1 * Math.cos(4*t), z = Math.sin(p) * 0.4;
                posHeart[idx] = x * 1.0; posHeart[idx+1] = (y * 1.0) + 0.5; posHeart[idx+2] = z;
            }

            for (let i = 0; i < NUM_PARTICLES; i++) {
                const idx = i * 3;
                if (i < 800) {
                    const angle = Math.floor(Math.random() * 8) * (Math.PI / 4), radius = Math.random() * 5;
                    posWeb[idx] = radius * Math.cos(angle); posWeb[idx+1] = radius * Math.sin(angle); posWeb[idx+2] = (Math.random() - 0.5) * 0.2;
                } else {
                    const ring = Math.ceil(Math.random() * 5), angle = Math.random() * Math.PI * 2;
                    posWeb[idx] = ring * Math.cos(angle); posWeb[idx+1] = ring * Math.sin(angle); posWeb[idx+2] = (Math.random() - 0.5) * 0.2;
                }
            }
        }

        // Bikin Canvas Teks 3D Otomatis dari Input Nama
        function updateTextShape(name) {
            const canvas = document.createElement('canvas');
            canvas.width = 400; canvas.height = 150;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = 'white';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.font = 'bold 40px Arial'; ctx.fillText('I LOVE YOU', 200, 40);
            ctx.font = 'bold 35px Arial'; ctx.fillText(name.toUpperCase(), 200, 90);
            
            const imgData = ctx.getImageData(0, 0, 400, 150).data;
            const textPoints = [];
            for(let y = 0; y < 150; y += 2) {
                for(let x = 0; x < 400; x += 2) {
                    if(imgData[(y * 400 + x) * 4 + 3] > 128) textPoints.push({x: (x - 200) * 0.04, y: -(y - 75) * 0.04});
                }
            }
            for (let i = 0; i < NUM_PARTICLES; i++) {
                const idx = i * 3;
                if (textPoints.length > 0) {
                    const pt = textPoints[i % textPoints.length];
                    posText[idx] = pt.x; posText[idx+1] = pt.y + 0.5; posText[idx+2] = (Math.random() - 0.5) * 0.6; 
                }
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            handX += (targetHandX - handX) * 0.1; handY += (targetHandY - handY) * 0.1;

            const positions = geometry.attributes.position.array;
            for (let i = 0; i < NUM_PARTICLES * 3; i++) positions[i] += (targetPos[i] - positions[i]) * 0.1;
            geometry.attributes.position.needsUpdate = true;

            if (currentMode === 1) rotationAngle += 0.005;
            else if (currentMode === 2) rotationAngle += 0.02;
            else if (currentMode === 3) rotationAngle += 0.015;
            else if (currentMode === 4) rotationAngle -= 0.01;
            else if (currentMode === 5) rotationAngle = 0; 

            if (currentMode === 5) {
                particleSystem.rotation.y = Math.sin(Date.now() * 0.001) * 0.2; particleSystem.rotation.x = 0;
            } else {
                particleSystem.rotation.y = rotationAngle;
                if (currentMode === 4) particleSystem.rotation.x = 0;
            }

            if (currentMode !== 1) { particleSystem.position.x = handX; particleSystem.position.y = handY; } 
            else { particleSystem.position.x = 0; particleSystem.position.y = 0; }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function hitungModeGestur(landmarks) {
            const tips = [8, 12, 16, 20], pips = [6, 10, 14, 18];
            let berdiri = [];
            for (let i = 0; i < 4; i++) berdiri.push(landmarks[tips[i]].y < landmarks[pips[i]].y);
            const jumlahJari = berdiri.filter(Boolean).length;

            if (berdiri[0] && berdiri[1] && !berdiri[2] && !berdiri[3]) return 5;
            if (berdiri[0] && !berdiri[1] && !berdiri[2] && berdiri[3]) return 4; 
            if (jumlahJari === 0) return 3; 
            if (berdiri[0] && !berdiri[1] && !berdiri[2] && !berdiri[3]) return 2; 
            return 1; 
        }

        function ubahWarnaTeksMode(color1, color2) {
            const modeLabel = document.getElementById('mode-label');
            modeLabel.style.background = `linear-gradient(90deg, ${color1}, ${color2})`;
            modeLabel.style.webkitBackgroundClip = "text"; modeLabel.style.webkitTextFillColor = "transparent";
        }

        // FITUR SCREENSHOT (HTML2Canvas)
        function takeScreenshot() {
            const btn = document.getElementById('capture-btn');
            btn.innerText = "📸 Menyimpan...";
            // Hide guide temporarily for clean screenshot
            document.getElementById('guide-wrapper').style.display = 'none';
            
            html2canvas(document.body).then(canvas => {
                const link = document.createElement('a');
                link.download = 'Momen-Romantis.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
                
                btn.innerText = "📸 Capture";
                document.getElementById('guide-wrapper').style.display = 'block';
            });
        }

        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');

        function onResults(results) {
            const spideyImg = document.getElementById('spidey-overlay');
            const loveImg = document.getElementById('love-overlay');
            const iloveyouText = document.getElementById('iloveyou-overlay');
            const label = document.getElementById('mode-label');
            const statusText = document.getElementById('status-text');
            const bgMusic = document.getElementById('bg-music');
            const thwipSfx = document.getElementById('thwip-sfx');
            const spaceSfx = document.getElementById('space-sfx');
            spaceSfx.volume = 0.5;

            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                statusText.style.display = 'none'; 
                const landmarks = results.multiHandLandmarks[0];
                currentMode = hitungModeGestur(landmarks);

                // --- TRACKING TULANG TANGAN ---
                canvasCtx.save();
                canvasCtx.strokeStyle = 'white'; canvasCtx.lineWidth = 4;
                for (const conn of HAND_CONNECTIONS) {
                    const p1 = landmarks[conn[0]], p2 = landmarks[conn[1]];
                    canvasCtx.beginPath(); canvasCtx.moveTo(p1.x * canvasElement.width, p1.y * canvasElement.height); canvasCtx.lineTo(p2.x * canvasElement.width, p2.y * canvasElement.height); canvasCtx.stroke();
                }
                canvasCtx.fillStyle = '#ff0033'; canvasCtx.strokeStyle = 'white'; canvasCtx.lineWidth = 2;
                for (let i = 0; i < landmarks.length; i++) {
                    const p = landmarks[i];
                    canvasCtx.beginPath(); canvasCtx.arc(p.x * canvasElement.width, p.y * canvasElement.height, 5, 0, 2 * Math.PI); canvasCtx.fill(); canvasCtx.stroke();
                }
                canvasCtx.restore();

                // --- MANAJEMEN SFX & ANIMASI ---
                if (currentMode !== lastMode) {
                    if (currentMode === 4) { thwipSfx.currentTime = 0; thwipSfx.play().catch(e=>{}); }
                    
                    if (currentMode === 1 || currentMode === 2) {
                        if (spaceSfx.paused) spaceSfx.play().catch(e=>{});
                        bgMusic.pause();
                    } else if (currentMode === 3 || currentMode === 5) {
                        if (bgMusic.paused) bgMusic.play().catch(e=>{});
                        spaceSfx.pause();
                    } else { bgMusic.pause(); spaceSfx.pause(); }

                    // Animasi Heartbeat CSS
                    if(currentMode === 3) loveImg.classList.add('heartbeat-anim');
                    else loveImg.classList.remove('heartbeat-anim');

                    lastMode = currentMode;
                }

                const wrist = landmarks[0];
                targetHandX = (0.5 - wrist.x) * 10; targetHandY = (0.5 - wrist.y) * 8;
                const screenX = (1 - wrist.x) * window.innerWidth, screenY = wrist.y * window.innerHeight;

                spideyImg.style.display = "none"; loveImg.style.display = "none"; iloveyouText.style.display = "none";

                if (currentMode === 1) {
                    targetPos = posSpace; label.innerText = "KOSMOS TERBUKA";
                    particleSystem.material.color.setHex(0x00d2ff); ubahWarnaTeksMode("#00d2ff", "#3a7bd5");
                } else if (currentMode === 2) {
                    targetPos = posPlanet; label.innerText = "ORBIT SATURNUS";
                    particleSystem.material.color.setHex(0xffaa00); ubahWarnaTeksMode("#ffaa00", "#ff7700");
                } else if (currentMode === 3) {
                    targetPos = posHeart; label.innerText = "BENTUK HATI";
                    particleSystem.material.color.setHex(0xff0066); ubahWarnaTeksMode("#ff0066", "#ff3399");
                    loveImg.style.display = "block"; loveImg.style.left = `${screenX}px`; loveImg.style.top = `${screenY}px`;
                } else if (currentMode === 4) {
                    targetPos = posWeb; label.innerText = "SPIDER-MAN";
                    particleSystem.material.color.setHex(0xff0033); ubahWarnaTeksMode("#ff0033", "#cc0000");
                    spideyImg.style.display = "block"; spideyImg.style.left = `${screenX}px`; spideyImg.style.top = `${screenY}px`;
                } else if (currentMode === 5) {
                    targetPos = posText; label.innerText = "I LOVE YOU";
                    particleSystem.material.color.setHex(0xff66ff); ubahWarnaTeksMode("#ff66ff", "#cc33ff");
                    iloveyouText.style.display = "block"; iloveyouText.style.left = `${screenX}px`; iloveyouText.style.top = `${screenY}px`;
                }
            } else {
                statusText.style.display = 'block'; statusText.innerText = "Arahkan tangan ke kamera";
                if (!bgMusic.paused) bgMusic.pause();
                if (!spaceSfx.paused) spaceSfx.pause();
                lastMode = -1; // Reset tracker 
            }
        }

        const hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
        hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
        hands.onResults(onResults);

        const videoElement = document.getElementById('webcam');
        const statusText = document.getElementById('status-text');

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: 480, height: 360 } });
                videoElement.srcObject = stream;
                statusText.innerText = "Menyiapkan AI...";
                videoElement.onloadedmetadata = () => {
                    async function processFrame() {
                        if (!videoElement.paused && !videoElement.ended) await hands.send({ image: videoElement });
                        requestAnimationFrame(processFrame);
                    }
                    processFrame();
                };
            } catch (err) {
                statusText.innerText = "Kamera diblokir / error"; alert("Izinkan akses kamera di browser kamu ya!");
            }
        }

        initThree();

        // LOGIKA TOMBOL MULAI & INPUT NAMA
        document.getElementById('start-btn').addEventListener('click', function() {
            // Ambil nama dari input (kalau kosong, defaultnya "SAYANG")
            const inputVal = document.getElementById('name-input').value.trim();
            customName = inputVal !== "" ? inputVal : "SAYANG";
            
            // Update teks overlay & bentuk partikel 3D
            document.getElementById('dynamic-name').innerText = customName.toUpperCase();
            updateTextShape(customName);

            document.getElementById('start-screen').style.opacity = '0';
            setTimeout(() => { document.getElementById('start-screen').style.display = 'none'; }, 500);

            document.getElementById('info').style.display = 'block';
            document.getElementById('webcam-container').style.display = 'block';
            document.getElementById('guide-wrapper').style.display = 'block';
            document.getElementById('capture-btn').style.display = 'block';

            // Pancing izin audio browser
            document.getElementById('space-sfx').play().catch(e=>{});

            startCamera();
        });

        document.getElementById('guide-btn').addEventListener('click', () => {
            document.getElementById('guide-panel').classList.toggle('active');
        });
    </script>
</body>
</html>
