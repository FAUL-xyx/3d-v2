<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Hand Gesture Particles - Spider-Man Edition</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
        }
        #webcam {
            position: absolute;
            bottom: 10px;
            right: 10px;
            width: 120px;
            height: 90px;
            transform: scaleX(-1);
            border-radius: 8px;
            border: 2px solid #00d2ff;
            z-index: 10;
            object-fit: cover;
        }
        #info {
            position: absolute;
            top: 15px;
            left: 15px;
            color: #fff;
            background: rgba(0,0,0,0.6);
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 10;
            pointer-events: none;
        }
        .mode-text {
            color: #00d2ff;
            font-weight: bold;
        }
        /* Styling untuk GIF Spiderman yang akan muncul */
        #spidey-overlay {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 5;
            pointer-events: none;
            border-radius: 15px;
            opacity: 0.85;
            width: 300px;
            box-shadow: 0 0 20px #ff0033;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

    <div id="info">
        MODE: <span id="mode-label" class="mode-text">KOSMOS (Terbuka)</span><br>
        <small id="status-text">Memuat kamera...</small>
    </div>
    
    <img id="spidey-overlay" src="https://media.giphy.com/media/SF9Z0shNT07T2/giphy.gif" alt="Spider-Man Web">

    <video id="webcam" autoplay playsinline muted></video>

    <script>
        const NUM_PARTICLES = 1500;
        let scene, camera, renderer, particleSystem, geometry;
        let currentPos, targetPos;
        // Tambahkan variabel posWeb
        let posSpace, posPlanet, posHeart, posWeb; 
        let currentMode = 1;
        
        let targetHandX = 0, targetHandY = 0;
        let handX = 0, handY = 0;
        let rotationAngle = 0;

        function initThree() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 12;

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(renderer.domElement);

            generateShapes();

            currentPos = new Float32Array(posSpace);
            targetPos = posSpace;

            geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(currentPos, 3));

            const material = new THREE.PointsMaterial({
                color: 0x00d2ff,
                size: 0.15,
                transparent: true,
                opacity: 0.8,
                blending: THREE.AdditiveBlending
            });

            particleSystem = new THREE.Points(geometry, material);
            scene.add(particleSystem);

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function generateShapes() {
            posSpace = new Float32Array(NUM_PARTICLES * 3);
            posPlanet = new Float32Array(NUM_PARTICLES * 3);
            posHeart = new Float32Array(NUM_PARTICLES * 3);
            posWeb = new Float32Array(NUM_PARTICLES * 3); // Inisialisasi jaring Spidey

            // Kosmos
            for (let i = 0; i < NUM_PARTICLES * 3; i += 3) {
                posSpace[i] = (Math.random() - 0.5) * 10;
                posSpace[i+1] = (Math.random() - 0.5) * 10;
                posSpace[i+2] = (Math.random() - 0.5) * 10;
            }

            // Saturnus
            const numSphere = 600;
            for (let i = 0; i < NUM_PARTICLES; i++) {
                const idx = i * 3;
                if (i < numSphere) {
                    const u = Math.random();
                    const v = Math.random();
                    const theta = u * 2.0 * Math.PI;
                    const phi = Math.acos(2.0 * v - 1.0);
                    const r = 1.3;
                    posPlanet[idx] = r * Math.sin(phi) * Math.cos(theta);
                    posPlanet[idx+1] = r * Math.sin(phi) * Math.sin(theta);
                    posPlanet[idx+2] = r * Math.cos(phi);
                } else {
                    const theta = Math.random() * Math.PI * 2;
                    const r = 2.0 + Math.random() * 2.0;
                    posPlanet[idx] = r * Math.cos(theta);
                    posPlanet[idx+1] = (Math.random() - 0.5) * 0.2;
                    posPlanet[idx+2] = r * Math.sin(theta);
                }
            }

            // Hati
            for (let i = 0; i < NUM_PARTICLES; i++) {
                const idx = i * 3;
                const t = (Math.random() * 2 - 1) * Math.PI;
                const p = (Math.random() * 2 - 1) * Math.PI;

                const x = 2.0 * Math.pow(Math.sin(t), 3);
                const y = 2.0 * Math.cos(t) - 0.7 * Math.cos(2*t) - 0.3 * Math.cos(3*t) - 0.1 * Math.cos(4*t);
                const z = Math.sin(p) * 0.4;

                posHeart[idx] = x * 0.8;
                posHeart[idx+1] = (y * 0.8) + 0.5;
                posHeart[idx+2] = z;
            }

            // Spider Web (Garis melingkar dan memusat)
            for (let i = 0; i < NUM_PARTICLES; i++) {
                const idx = i * 3;
                if (i < 800) {
                    // Garis lurus jaring (8 arah)
                    const angle = Math.floor(Math.random() * 8) * (Math.PI / 4);
                    const radius = Math.random() * 5;
                    posWeb[idx] = radius * Math.cos(angle);
                    posWeb[idx+1] = radius * Math.sin(angle);
                    posWeb[idx+2] = (Math.random() - 0.5) * 0.2;
                } else {
                    // Lingkaran melingkar jaring
                    const ring = Math.ceil(Math.random() * 5); // 5 lapis lingkaran
                    const angle = Math.random() * Math.PI * 2;
                    posWeb[idx] = ring * Math.cos(angle);
                    posWeb[idx+1] = ring * Math.sin(angle);
                    posWeb[idx+2] = (Math.random() - 0.5) * 0.2;
                }
            }
        }

        function animate() {
            requestAnimationFrame(animate);

            handX += (targetHandX - handX) * 0.1;
            handY += (targetHandY - handY) * 0.1;

            const positions = geometry.attributes.position.array;
            for (let i = 0; i < NUM_PARTICLES * 3; i++) {
                positions[i] += (targetPos[i] - positions[i]) * 0.1;
            }
            geometry.attributes.position.needsUpdate = true;

            // Atur kecepatan rotasi
            if (currentMode === 1) rotationAngle += 0.005;
            else if (currentMode === 2) rotationAngle += 0.02;
            else if (currentMode === 3) rotationAngle += 0.015;
            else if (currentMode === 4) rotationAngle -= 0.01; // Jaring berputar terbalik

            particleSystem.rotation.y = rotationAngle;
            // Agar web terlihat lurus menghadap kamera
            if (currentMode === 4) particleSystem.rotation.x = 0; 

            if (currentMode !== 1) {
                particleSystem.position.x = handX;
                particleSystem.position.y = handY;
            } else {
                particleSystem.position.x = 0;
                particleSystem.position.y = 0;
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function hitungModeGestur(landmarks) {
            const tips = [8, 12, 16, 20];
            const pips = [6, 10, 14, 18];
            let berdiri = [];

            for (let i = 0; i < 4; i++) {
                berdiri.push(landmarks[tips[i]].y < landmarks[pips[i]].y);
            }

            const jumlahJari = berdiri.filter(Boolean).length;

            // --- LOGIKA SPIDER-MAN DISINI ---
            // Telunjuk (0) berdiri, Tengah (1) turun, Manis (2) turun, Kelingking (3) berdiri
            if (berdiri[0] && !berdiri[1] && !berdiri[2] && berdiri[3]) {
                return 4; 
            }

            if (jumlahJari === 0) return 3; 
            if (berdiri[0] && !berdiri[1] && !berdiri[2] && !berdiri[3]) return 2; 
            return 1; 
        }

        function onResults(results) {
            const spideyImg = document.getElementById('spidey-overlay');
            const label = document.getElementById('mode-label');

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                currentMode = hitungModeGestur(landmarks);

                const wrist = landmarks[0];
                targetHandX = (0.5 - wrist.x) * 10;
                targetHandY = (0.5 - wrist.y) * 8;

                if (currentMode === 1) {
                    targetPos = posSpace;
                    label.innerText = "KOSMOS (Terbuka)";
                    particleSystem.material.color.setHex(0x00d2ff);
                    spideyImg.style.display = "none";
                } else if (currentMode === 2) {
                    targetPos = posPlanet;
                    label.innerText = "SATURNUS (Telunjuk)";
                    particleSystem.material.color.setHex(0xffaa00);
                    spideyImg.style.display = "none";
                } else if (currentMode === 3) {
                    targetPos = posHeart;
                    label.innerText = "BENTUK HATI (Kepal)";
                    particleSystem.material.color.setHex(0xff0066);
                    spideyImg.style.display = "none";
                } else if (currentMode === 4) {
                    targetPos = posWeb;
                    label.innerText = "SPIDER-MAN (Jaring!)";
                    particleSystem.material.color.setHex(0xff0033); // Warna Merah Spidey
                    spideyImg.style.display = "block"; // Munculkan GIF Spiderman
                }
            }
        }

        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        hands.onResults(onResults);

        const videoElement = document.getElementById('webcam');
        const statusText = document.getElementById('status-text');

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user', width: 480, height: 360 }
                });
                videoElement.srcObject = stream;
                statusText.innerText = "Arahkan kamera ke tangan";
                
                videoElement.onloadedmetadata = () => {
                    async function processFrame() {
                        if (!videoElement.paused && !videoElement.ended) {
                            await hands.send({ image: videoElement });
                        }
                        requestAnimationFrame(processFrame);
                    }
                    processFrame();
                };
            } catch (err) {
                statusText.innerText = "Kamera diblokir / tidak terdeteksi";
                alert("Izinkan akses kamera di browser HP Anda!");
            }
        }

        initThree();
        startCamera();
    </script>
</body>
</html>
