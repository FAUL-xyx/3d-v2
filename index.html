<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Hand Gesture Particles - Love Edition</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
        }
        #webcam {
            position: absolute;
            bottom: 10px;
            right: 10px;
            width: 120px;
            height: 90px;
            transform: scaleX(-1);
            border-radius: 8px;
            border: 2px solid #00d2ff;
            z-index: 10;
            object-fit: cover;
        }
        #info {
            position: absolute;
            top: 15px;
            left: 15px;
            color: #fff;
            background: rgba(0,0,0,0.6);
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 10;
            pointer-events: none;
        }
        .mode-text {
            color: #00d2ff;
            font-weight: bold;
        }
        #spidey-overlay {
            display: none;
            position: absolute;
            transform: translate(-50%, -50%);
            z-index: 5;
            pointer-events: none;
            border-radius: 15px;
            opacity: 0.85;
            width: 300px;
            box-shadow: 0 0 20px #ff0033;
        }
        #love-overlay {
    display: none;
    position: absolute;
    transform: translate(-50%, -50%);
    z-index: 5;
    pointer-events: none;
    width: 180px;
    height: 180px;
    object-fit: cover;
    opacity: 0.95;
    -webkit-mask-image: url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Cpath d='M462.3 62.6C407.5 15.9 326 24.3 275.7 76.2L256 96.5l-19.7-20.3C186.1 24.3 104.5 15.9 49.7 62.6c-62.8 53.6-66.1 149.8-9.9 207.9l193.5 199.8c12.5 12.9 32.8 12.9 45.3 0l193.5-199.8c56.3-58.1 53-154.3-9.8-207.9z'/%3E%3C/svg%3E");
    -webkit-mask-size: contain;
    -webkit-mask-repeat: no-repeat;
    -webkit-mask-position: center;
    mask-image: url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Cpath d='M462.3 62.6C407.5 15.9 326 24.3 275.7 76.2L256 96.5l-19.7-20.3C186.1 24.3 104.5 15.9 49.7 62.6c-62.8 53.6-66.1 149.8-9.9 207.9l193.5 199.8c12.5 12.9 32.8 12.9 45.3 0l193.5-199.8c56.3-58.1 53-154.3-9.8-207.9z'/%3E%3C/svg%3E");
    mask-size: contain;
    mask-repeat: no-repeat;
    mask-position: center;
    filter: drop-shadow(0 0 15px #ff0066);
}

        }
        /* Tambahan Styling untuk Teks I LOVE YOU */
        #iloveyou-overlay {
            display: none;
            position: absolute;
            transform: translate(-50%, 50%); /* Posisinya agak di bawah tangan */
            z-index: 5;
            color: #ff66ff;
            font-size: 32px;
            font-weight: bold;
            text-shadow: 0 0 15px #ff66ff, 0 0 30px #ff00ff, 0 0 5px #fff;
            pointer-events: none;
            text-align: center;
            white-space: nowrap;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

    <div id="info">
        MODE: <span id="mode-label" class="mode-text">KOSMOS (Terbuka)</span><br>
        <small id="status-text">Memuat kamera...</small>
    </div>
    
    <img id="spidey-overlay" src="https://media.giphy.com/media/SF9Z0shNT07T2/giphy.gif" alt="Spider-Man Web">
    
    <img id="love-overlay" src="sekolah.jpg" alt="Love Photo">
    
    <div id="iloveyou-overlay">I LOVE YOU<br>🫶</div>

    <video id="webcam" autoplay playsinline muted></video>

    <script>
        const NUM_PARTICLES = 1500;
        let scene, camera, renderer, particleSystem, geometry;
        let currentPos, targetPos;
        // Tambahkan variabel posText
        let posSpace, posPlanet, posHeart, posWeb, posText; 
        let currentMode = 1;
        
        let targetHandX = 0, targetHandY = 0;
        let handX = 0, handY = 0;
        let rotationAngle = 0;

        function initThree() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 12;

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(renderer.domElement);

            generateShapes();

            currentPos = new Float32Array(posSpace);
            targetPos = posSpace;

            geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(currentPos, 3));

            const material = new THREE.PointsMaterial({
                color: 0x00d2ff,
                size: 0.15,
                transparent: true,
                opacity: 0.8,
                blending: THREE.AdditiveBlending
            });

            particleSystem = new THREE.Points(geometry, material);
            scene.add(particleSystem);

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function generateShapes() {
            posSpace = new Float32Array(NUM_PARTICLES * 3);
            posPlanet = new Float32Array(NUM_PARTICLES * 3);
            posHeart = new Float32Array(NUM_PARTICLES * 3);
            posWeb = new Float32Array(NUM_PARTICLES * 3);
            posText = new Float32Array(NUM_PARTICLES * 3); // Shape teks

            // Kosmos
            for (let i = 0; i < NUM_PARTICLES * 3; i += 3) {
                posSpace[i] = (Math.random() - 0.5) * 10;
                posSpace[i+1] = (Math.random() - 0.5) * 10;
                posSpace[i+2] = (Math.random() - 0.5) * 10;
            }

            // Saturnus
            const numSphere = 600;
            for (let i = 0; i < NUM_PARTICLES; i++) {
                const idx = i * 3;
                if (i < numSphere) {
                    const u = Math.random();
                    const v = Math.random();
                    const theta = u * 2.0 * Math.PI;
                    const phi = Math.acos(2.0 * v - 1.0);
                    const r = 1.3;
                    posPlanet[idx] = r * Math.sin(phi) * Math.cos(theta);
                    posPlanet[idx+1] = r * Math.sin(phi) * Math.sin(theta);
                    posPlanet[idx+2] = r * Math.cos(phi);
                } else {
                    const theta = Math.random() * Math.PI * 2;
                    const r = 2.0 + Math.random() * 2.0;
                    posPlanet[idx] = r * Math.cos(theta);
                    posPlanet[idx+1] = (Math.random() - 0.5) * 0.2;
                    posPlanet[idx+2] = r * Math.sin(theta);
                }
            }

            // Hati
            for (let i = 0; i < NUM_PARTICLES; i++) {
                const idx = i * 3;
                const t = (Math.random() * 2 - 1) * Math.PI;
                const p = (Math.random() * 2 - 1) * Math.PI;

                const x = 2.0 * Math.pow(Math.sin(t), 3);
                const y = 2.0 * Math.cos(t) - 0.7 * Math.cos(2*t) - 0.3 * Math.cos(3*t) - 0.1 * Math.cos(4*t);
                const z = Math.sin(p) * 0.4;

                posHeart[idx] = x * 1.0; 
                posHeart[idx+1] = (y * 1.0) + 0.5;
                posHeart[idx+2] = z;
            }

            // Spider Web
            for (let i = 0; i < NUM_PARTICLES; i++) {
                const idx = i * 3;
                if (i < 800) {
                    const angle = Math.floor(Math.random() * 8) * (Math.PI / 4);
                    const radius = Math.random() * 5;
                    posWeb[idx] = radius * Math.cos(angle);
                    posWeb[idx+1] = radius * Math.sin(angle);
                    posWeb[idx+2] = (Math.random() - 0.5) * 0.2;
                } else {
                    const ring = Math.ceil(Math.random() * 5);
                    const angle = Math.random() * Math.PI * 2;
                    posWeb[idx] = ring * Math.cos(angle);
                    posWeb[idx+1] = ring * Math.sin(angle);
                    posWeb[idx+2] = (Math.random() - 0.5) * 0.2;
                }
            }

            // Teks "I LOVE YOU" via Virtual Canvas
            const canvas = document.createElement('canvas');
            canvas.width = 250;
            canvas.height = 120;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = 'white';
            ctx.font = 'bold 35px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('I LOVE', 125, 40);
            ctx.fillText('YOU', 125, 80);
            
            const imgData = ctx.getImageData(0, 0, 250, 120).data;
            const textPoints = [];
            
            for(let y = 0; y < 120; y += 2) {
                for(let x = 0; x < 250; x += 2) {
                    const alpha = imgData[(y * 250 + x) * 4 + 3];
                    if(alpha > 128) {
                        textPoints.push({x: (x - 125) * 0.05, y: -(y - 60) * 0.05});
                    }
                }
            }
            
            for (let i = 0; i < NUM_PARTICLES; i++) {
                const idx = i * 3;
                if (textPoints.length > 0) {
                    const pt = textPoints[i % textPoints.length];
                    posText[idx] = pt.x;
                    posText[idx+1] = pt.y + 0.5;
                    // Bikin efek ketebalan biar partikel teksnya ada volume 3D-nya
                    posText[idx+2] = (Math.random() - 0.5) * 0.6; 
                }
            }
        }

        function animate() {
            requestAnimationFrame(animate);

            handX += (targetHandX - handX) * 0.1;
            handY += (targetHandY - handY) * 0.1;

            const positions = geometry.attributes.position.array;
            for (let i = 0; i < NUM_PARTICLES * 3; i++) {
                positions[i] += (targetPos[i] - positions[i]) * 0.1;
            }
            geometry.attributes.position.needsUpdate = true;

            // Rotasi Partikel
            if (currentMode === 1) rotationAngle += 0.005;
            else if (currentMode === 2) rotationAngle += 0.02;
            else if (currentMode === 3) rotationAngle += 0.015;
            else if (currentMode === 4) rotationAngle -= 0.01;
            // Mode 5 (Teks I LOVE YOU) sengaja gak diputar y-nya biar tulisannya kebaca
            else if (currentMode === 5) rotationAngle = 0; 

            if (currentMode === 5) {
                // Goyang sedikit biar partikel teks hidup
                particleSystem.rotation.y = Math.sin(Date.now() * 0.001) * 0.2; 
                particleSystem.rotation.x = 0;
            } else {
                particleSystem.rotation.y = rotationAngle;
                if (currentMode === 4) particleSystem.rotation.x = 0;
            }

            if (currentMode !== 1) {
                particleSystem.position.x = handX;
                particleSystem.position.y = handY;
            } else {
                particleSystem.position.x = 0;
                particleSystem.position.y = 0;
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function hitungModeGestur(landmarks) {
            const tips = [8, 12, 16, 20];
            const pips = [6, 10, 14, 18];
            let berdiri = [];

            for (let i = 0; i < 4; i++) {
                berdiri.push(landmarks[tips[i]].y < landmarks[pips[i]].y);
            }

            const jumlahJari = berdiri.filter(Boolean).length;

            // Mode 5: PEACE (Telunjuk dan Tengah berdiri, sisanya turun)
            if (berdiri[0] && berdiri[1] && !berdiri[2] && !berdiri[3]) {
                return 5;
            }

            // Mode 4: SPIDER-MAN
            if (berdiri[0] && !berdiri[1] && !berdiri[2] && berdiri[3]) {
                return 4; 
            }

            // Mode 3: BENTUK HATI (Semua turun/kepal)
            if (jumlahJari === 0) return 3; 
            
            // Mode 2: SATURNUS (Telunjuk doang)
            if (berdiri[0] && !berdiri[1] && !berdiri[2] && !berdiri[3]) return 2; 
            
            // Mode 1: KOSMOS (Default / Terbuka)
            return 1; 
        }

        function onResults(results) {
            const spideyImg = document.getElementById('spidey-overlay');
            const loveImg = document.getElementById('love-overlay');
            const iloveyouText = document.getElementById('iloveyou-overlay');
            const label = document.getElementById('mode-label');

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                currentMode = hitungModeGestur(landmarks);

                const wrist = landmarks[0];
                
                targetHandX = (0.5 - wrist.x) * 10;
                targetHandY = (0.5 - wrist.y) * 8;
                
                const screenX = (1 - wrist.x) * window.innerWidth;
                const screenY = wrist.y * window.innerHeight;

                // Sembunyikan semua elemen overlay di awal agar bisa diaktifkan sesuai mode
                spideyImg.style.display = "none";
                loveImg.style.display = "none";
                iloveyouText.style.display = "none";

                if (currentMode === 1) {
                    targetPos = posSpace;
                    label.innerText = "KOSMOS (Terbuka)";
                    particleSystem.material.color.setHex(0x00d2ff);
                    
                } else if (currentMode === 2) {
                    targetPos = posPlanet;
                    label.innerText = "SATURNUS (Telunjuk)";
                    particleSystem.material.color.setHex(0xffaa00);
                    
                } else if (currentMode === 3) {
                    targetPos = posHeart;
                    label.innerText = "BENTUK HATI (Kepal)";
                    particleSystem.material.color.setHex(0xff0066);
                    
                    loveImg.style.display = "block";
                    loveImg.style.left = `${screenX}px`;
                    loveImg.style.top = `${screenY}px`;
                    
                } else if (currentMode === 4) {
                    targetPos = posWeb;
                    label.innerText = "SPIDER-MAN (Jaring!)";
                    particleSystem.material.color.setHex(0xff0033);
                    
                    spideyImg.style.display = "block"; 
                    spideyImg.style.left = `${screenX}px`;
                    spideyImg.style.top = `${screenY}px`;
                    
                } else if (currentMode === 5) {
                    targetPos = posText;
                    label.innerText = "PEACE (I Love You)";
                    particleSystem.material.color.setHex(0xff66ff); // Warna Pink Muda
                    
                    // Munculkan Teks I LOVE YOU
                    iloveyouText.style.display = "block";
                    iloveyouText.style.left = `${screenX}px`;
                    iloveyouText.style.top = `${screenY}px`;
                }
            }
        }

        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        hands.onResults(onResults);

        const videoElement = document.getElementById('webcam');
        const statusText = document.getElementById('status-text');

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user', width: 480, height: 360 }
                });
                videoElement.srcObject = stream;
                statusText.innerText = "Arahkan kamera ke tangan";
                
                videoElement.onloadedmetadata = () => {
                    async function processFrame() {
                        if (!videoElement.paused && !videoElement.ended) {
                            await hands.send({ image: videoElement });
                        }
                        requestAnimationFrame(processFrame);
                    }
                    processFrame();
                };
            } catch (err) {
                statusText.innerText = "Kamera diblokir / tidak terdeteksi";
                alert("Izinkan akses kamera di browser HP Anda!");
            }
        }

        initThree();
        startCamera();
    </script>
</body>
</html>
